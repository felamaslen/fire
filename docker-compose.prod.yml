services:
  # Monolithic app container: the Fastify backend serves the GraphQL API on
  # `/graphql` and the prebuilt SPA for everything else. Bound to loopback so
  # the host's nginx is the only public entrypoint.
  app:
    image: felamaslen/fire:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://fire:${POSTGRES_PASSWORD}@postgres:5432/fire
      UPLOADS_DIR: /data/uploads
      YAHOO_CACHE_PATH: /data/cache/yahoo.json
      PORT: 4000
      API_URL: ${API_URL:-}
      # OTel config flows in from the host's `.env` (or shell). Defaults to
      # off so the backend doesn't silently depend on a running collector.
      # Point `OTEL_EXPORTER_OTLP_ENDPOINT` at a hosted collector (e.g.
      # Sentry, Grafana Cloud) and set `OTEL_EXPORTER_OTLP_HEADERS` with
      # the auth header — see `packages/backend/src/env.ts` for the full
      # list of supported signal-specific overrides.
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${OTEL_EXPORTER_OTLP_TRACES_HEADERS:-}
      OTEL_EXPORTER_OTLP_LOGS_HEADERS: ${OTEL_EXPORTER_OTLP_LOGS_HEADERS:-}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENEXCHANGERATES_APP_ID: ${OPENEXCHANGERATES_APP_ID:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_PIN: ${AUTH_PIN:-}
    ports:
      - "127.0.0.1:${APP_PORT:-4000}:4000"
    volumes:
      - ./var/uploads:/data/uploads
      - ./var/cache:/data/cache
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4000/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    command: postgres -c client_min_messages=warning
    environment:
      POSTGRES_DB: fire
      POSTGRES_USER: fire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # `postgres:18` relocated PGDATA to `/var/lib/postgresql/18/docker`;
      # earlier versions used `/var/lib/postgresql/data`. A bind on the
      # old path binds an empty leaf that Docker auto-volumes the parent
      # of — real data ends up in an anonymous volume, which `docker
      # compose down -v` would silently wipe.
      - ./var/db:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fire -d fire"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Daily `pg_dump` with built-in rotation. `BACKUP_KEEP_DAYS=7` keeps a
  # rolling 7-day window of daily dumps in `./var/backups/daily`, and
  # `BACKUP_KEEP_MONTHS=12` keeps one dump per month for a year in
  # `./var/backups/monthly`.
  backup:
    image: prodrigestivill/postgres-backup-local:18-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: fire
      POSTGRES_USER: fire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 0
      BACKUP_KEEP_MONTHS: 12
      SCHEDULE: "@daily"
    volumes:
      - ./var/backups:/backups
