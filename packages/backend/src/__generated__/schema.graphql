"""
Aggregated view of the portfolio, optionally filtered by wrappers and/or investments. All money values are expressed in `currency`; investments in any other currency are excluded.
"""
type Portfolio {
  """
  Per-investment breakdown of the filtered portfolio's current market value, expressed as fractions in `[0, 1]` that sum to `1`. Each entry pairs an investment with its share. Investments that contribute zero value (no holdings, fully sold, or missing a price) are excluded; the remaining fractions are renormalised over those that do contribute. Returns an empty array when the portfolio has no positive value.
  """
  allocations: [PortfolioAllocation!]!
  """Candlestick buckets of portfolio total over the requested period."""
  candlestick(
    length: Int! = 1
    """
    Maximum number of candle buckets to return. The series ends today and
    extends backwards by `max × length` `unit`s.
    """
    max: Int! = 50 @constraint(max: 100, min: 1)
    unit: PortfolioCandleUnit!
  ): PortfolioCandlestick
  """
  Uninvested cash held in the wrapper(s) — the per-wrapper cash float aggregated across the portfolio's `filterAssetIdIn` (or every `STOCK` / `PENSION` wrapper when no asset filter is set), restricted to entries denominated in `currency`. Always zero when the portfolio is scoped to specific investments (cash isn't attributable to an investment). Positive values represent cash available to invest; negative values mean recorded buys exceed recorded inflows.
  """
  cash: Money!
  """
  ISO-4217 code every aggregate on this `Portfolio` is expressed in. Investments held in other currencies are excluded from these numbers.
  """
  currency: String!
  """
  Fractional change in portfolio value over the most recent pricing interval, computed from the same subset of currently-held, live-priced positions as `dailyGainValue` — `Σ Δ / Σ previousValue`. `null` when no qualifying position exists, when the previous total is zero, or when `skipLive` is set.
  """
  dailyGainPercent: Float
  """
  Change in portfolio value over the most recent pricing interval — `Σ (live_price − previousClose) × unitsHeld` over every currently-held position with a live quote. Positions the portfolio no longer holds (`unitsHeld === 0`) and positions without a live quote are excluded, so a lapsed live quote for one ticker doesn't pollute the aggregate. `null` when no position has a live quote or when `skipLive` is set.
  """
  dailyGainValue: Money
  """
  Synthetic, stable identifier derived from the filters + currency + `skipLive`. Used for client-side cache normalisation; not meaningful as an external key. `skipLive` is part of the id so a page that reads both the cached-close snapshot and the live snapshot keeps them as separate entities — otherwise Apollo would merge them and the first response's values would be clobbered by the second.
  """
  id: ID!
  """
  When this portfolio is scoped to exactly one investment (as emitted by `Query.portfolios`), the investment it represents. `null` for aggregate portfolios covering multiple investments.
  """
  investment: Investment
  """
  Total return as a fraction of `totalCost`, computed from invested value only (cash float excluded). For a more robust performance number that accounts for the timing of deposits and withdrawals, use `xirr`. `null` when `totalCost` is zero.
  """
  percentGain: Float
  """
  Daily-sampled line series of portfolio total over the requested period.
  """
  timeseries(length: Int, period: PortfolioTimePeriod!): PortfolioTimeseries
  """
  Net capital at stake: gross buys minus gross sells across every investment, including ones that are now fully sold (whose sell proceeds drag the number down or even negative when realised gains exceed gross bought). Excludes fees and taxes.
  """
  totalCost: Money!
  """
  Total return (realised + unrealised) on the held positions — `(totalValue − cash) − totalCost`. Excludes the cash float so freshly-deposited funds don't read as a gain.
  """
  totalGain: Money
  """
  Current market value of the filtered portfolio — the today-price value of units currently held plus uninvested cash held in the wrapper(s). Fully-sold positions contribute nothing; their realised gain is reflected by pulling `totalCost` down. Positions with no known price (neither a live quote nor any `InvestmentPrices` row) contribute zero rather than nulling the whole aggregate — matches the `timeseries` / `dailyGain*` fields' graceful-degradation behaviour so a single stale or unresolvable ticker doesn't wipe the headline.
  """
  totalValue: Money
  """
  Annualised rate of return on the filtered portfolio computed from the full cash-flow history (every buy as a negative flow, every sell as a positive one) plus today's held market value as the terminal flow. Roughly what a spreadsheet's `XIRR` returns. Expressed as a decimal (`0.08` = 8 % / year). `null` when there aren't enough cash flows to solve or when the solver doesn't converge. Honours the instance-level `skipLive` — with `skipLive`, the terminal flow uses the most recent cached close instead of the live price.
  """
  xirr: Float
}

"""
Share of the parent `Portfolio`'s current market value held in one investment. `fraction` is in `[0, 1]`; values across a `Portfolio.allocations` array sum to `1` (modulo floating-point error). Held investments missing a price are excluded entirely so they don't drag the denominator.
"""
type PortfolioAllocation {
  """
  Fraction of the `Portfolio`'s total value held in this investment, in `[0, 1]`.
  """
  fraction: Float!
  investment: Investment!
}

"""
OHLC-style time series of portfolio total, downsampled to at most 300 buckets while always preserving the first and last bucket.
"""
type PortfolioCandlestick {
  currency: String!
  initialDate: Date!
  points: [PortfolioCandlestickPoint!]!
}

"""
One OHLC candlestick bucket. `from` / `to` are the portfolio total at the bucket's start / end; `lo` / `hi` are the minimum / maximum across the bucket. All values are in major units of `currency`.
"""
type PortfolioCandlestickPoint {
  """
  Starting Y value in major currency units of the parent `PortfolioCandlestick` `currency` field
  """
  from: Int!
  """
  Highest Y value in major currency units of the parent `PortfolioCandlestick` `currency` field
  """
  hi: Int!
  """
  Lowest Y value in major currency units of the parent `PortfolioCandlestick` `currency` field
  """
  lo: Int!
  """
  Ending Y value in major currency units of the parent `PortfolioCandlestick` `currency` field
  """
  to: Int!
  """
  Number of days (at start of candle) since `initialDate` on the parent `PortfolioCandlestick`
  """
  x0: Int!
  """
  Number of days (at end of candle) since `initialDate` on the parent `PortfolioCandlestick`
  """
  x1: Int!
}

"""
A cursor-paginated list. Concrete materialisations (e.g. `Connection<NetWorthEntry>` → `NetWorthEntryConnection`) are emitted per node type.
"""
type PortfolioConnection {
  edges: [PortfolioEdge!]!
  pageInfo: PageInfo!
}

"""
A single entry inside a `Connection`. Carries its own `cursor` so clients can resume pagination from any row.
"""
type PortfolioEdge {
  cursor: ID!
  node: Portfolio!
}

"""
One push of live values for the investments page: the aggregated `Portfolio` the headline reads from, plus every currently-held investment matching the same filter (sold-out positions are excluded — their per-row figures don't change between ticks). Streamed by the `portfolioLive` subscription.
"""
type PortfolioLiveTick {
  """
  Currently-held investments matching the filter, with refreshed price + position fields.
  """
  investments: [Investment!]!
  """Aggregated portfolio (live-overlaid) for the subscription's filter."""
  portfolio: Portfolio!
}

"""
Daily-valued time series of portfolio total, downsampled to at most 300 points while always preserving the first and last sample.
"""
type PortfolioTimeseries {
  currency: String!
  initialDate: Date!
  points: [PortfolioTimeseriesPoint!]!
}

"""
One line-chart sample: `x` days since the series' `initialDate`, `y` in major units of `currency`.
"""
type PortfolioTimeseriesPoint {
  x: Int!
  y: Int!
}

type Query {
  """
  Every registered bill, paginated and sorted by `start` descending (most-recently-starting first, `id` tiebreak).
  """
  bills(after: ID, first: Int): PlanningBillConnection @semanticNonNull
  """
  Current cash position: the sum of cash balances across every planning account (net-worth assets of type `CASH` that back a `PlanningAccount`) taken from the latest net-worth entry, minus projected and recorded outflows for the current month up to today. Cash assets that aren't wired up as planning accounts are ignored — those don't show up on the planning page and aren't part of the day-to-day cash float this field is meant to represent.
  """
  cashPosition: Money @semanticNonNull
  """
  Every currency code the server accepts for money inputs, paired with a human-readable name. Use this to populate currency pickers.
  """
  currencies: [Currency!] @semanticNonNull
  """
  ISO-4217 code of the server's configured home currency (e.g. `"GBP"`). Used by clients as the default currency when the user has not configured any currency rates on an entry.
  """
  currencyDefault: String @semanticNonNull
  """
  Fetch live exchange rates for one or more foreign currencies, quoted into the server's home currency (see `currencyDefault`). Each returned `rate` is in units of the home currency per 1 unit of the foreign currency. Rates are pulled from openexchangerates.org and cached server-side for 5 minutes per currency.
  """
  currencyExchangeRates(
    """
    ISO-4217 codes to look up against the home currency. The home currency itself is silently skipped.
    """
    currencies: [String!]!
  ): [CurrencyExchangeRate!] @semanticNonNull
  """List available demo flavours for the login screen."""
  demos: [Demo!] @noAuth
  """
  Every registered earnings stream, paginated and sorted by `start` descending (most-recently-starting first, `id` tiebreak).
  """
  earnings(after: ID, first: Int): PlanningEarningConnection @semanticNonNull
  """
  Allocations configured for one wrapper. When `assetId` is `null`, portfolio-wide allocations (weighted across wrappers) — **not yet implemented**, returns an error.
  """
  investmentAllocations(
    """
    The wrapper whose allocations to return. Pass `null` to aggregate across the whole portfolio (coming in a later release).
    """
    assetId: ID
  ): InvestmentAllocationsResult @semanticNonNull
  """
  Paginated list of investments, sorted by the requested key. Computed sorts (`value`, `gainAbs`, `gainPercent`) use current cached values; cursors are only stable while those values don't change.
  """
  investments(
    after: ID
    """
    When set and non-empty, only investments with at least one transaction booked against any of these wrappers are returned (in addition to investments with no transactions at all), and computed sort keys (`value`, `gainAbs`, `gainPercent`) are scoped to the union of those wrappers.
    """
    filterAssetIdIn: [ID!]
    """
    Filter on whether the investment is fully sold — i.e. has at least one transaction but a net-zero unit count (scoped to `filterAssetIdIn` when set and non-empty). `false` excludes sold investments, `true` keeps only sold ones, `null` / omitted applies no filter. Investments with no transactions are never considered sold.
    """
    filterIsSold: Boolean
    first: Int
    sort: InvestmentSort
  ): InvestmentConnection @semanticNonNull
  """
  Return the current session's auth info, or `null` if the request is anonymous. Used by the web app on boot to decide whether to send the user to the login screen or straight to the dashboard.
  """
  me: AuthResult @noAuth
  """Paginated list of net-worth entries, newest first."""
  netWorth(after: ID, before: ID, first: Int, last: Int): NetWorthEntryConnection @semanticNonNull
  """
  Paginated list of all net-worth categories (assets, liabilities, options), newest first.
  """
  netWorthCategories(
    after: ID
    before: ID
    """
    When set and non-empty, only categories whose kind is in this list are returned. Omitted / null / empty includes every kind.
    """
    filterKindIn: [NetWorthCategoryKind!]
    """
    When set and non-empty, only categories whose `type` is in this list are returned. Asset and liability rows are filtered against their respective `type` columns; equity-option categories have no `type` and are excluded whenever this filter is set. Omitted / null / empty applies no type filter.
    """
    filterTypeIn: [NetWorthCategoryType!]
    first: Int
    last: Int
  ): NetWorthCategoryConnection @semanticNonNull
  """Look up an asset category by id. Returns `null` when no row matches."""
  netWorthCategoryAsset(id: ID!): NetWorthCategoryAsset
  """Look up a single net-worth entry by id."""
  netWorthEntry(id: ID!): NetWorthEntry
  """
  Projected monthly net worth for the next `years` years, thinned to `limit` evenly-spaced points. The engine always projects monthly internally; at `years = 10, limit = 20`, callers see one point every six months. The forecast always starts at today (the latest recorded snapshot) and ends at exactly `years` from today.
  """
  netWorthForecast(
    """
    Number of forecast points to return — evenly spaced between now and `years` years from now.
    """
    limit: Int! = 10 @constraint(max: 20, min: 5)
    """Forecast horizon in years (integer; 1–50)."""
    years: Int!
  ): NetWorthForecast @semanticNonNull
  """
  Full history of net-worth snapshots, oldest first. Each point exposes gross assets split by type plus the overall assets / liabilities / net totals. All amounts are converted into the home currency via each entry's own captured currency rates.
  """
  netWorthHistory: [NetWorthHistoryPoint!] @semanticNonNull
  """
  Every recorded payslip, paginated and sorted by pay date descending (most-recent first, `id` tiebreak).
  """
  payslips(after: ID, first: Int): PlanningPayslipConnection @semanticNonNull
  """Call this to check that the GraphQL server is working properly"""
  ping: Pong @semanticNonNull
  """
  Look up a planning year by its id (the starting calendar year, e.g. `"2025"`). Returns a synthetic year (months generated, tax rates null) when no data has been written for this year yet. Only returns null when `id` isn't a 4-digit year.
  """
  planningYear(id: ID!): PlanningYear
  """
  The planning year to land the user on by default — the UK financial year covering today (6 April → 5 April cutover: dates before 6 April belong to the previous FY). Always returns a year, even when no planning data has been recorded yet (the result is synthetic in that case).
  """
  planningYearCurrent: PlanningYear @semanticNonNull
  """
  Every planning year the user can reasonably work in, ordered oldest first. The range spans from the first `NetWorthEntry`'s FY up to 5 FYs past today (or past the most-recent entry, whichever is later); when no entries exist yet it starts at the current FY. Years without any stored data are synthesised on the fly. Supports forward (`first` / `after`) and backward (`last` / `before`) pagination.
  """
  planningYears(after: ID, before: ID, first: Int, last: Int): PlanningYearConnection @semanticNonNull
  """
  Aggregated view of the portfolio, optionally filtered by wrappers and/or investments. All money values are in `currency` (defaults to the server's home currency); investments held in any other currency are excluded.
  """
  portfolio(
    """
    ISO-4217 code to express all aggregates in. Investments held in any other currency are excluded. Defaults to the server's home currency.
    """
    currency: String
    filterAssetIdIn: [ID!]
    filterInvestmentIdIn: [ID!]
    """
    When `true`, every value field on the returned `Portfolio` (`totalValue`, `totalGain`, `percentGain`, `xirr`, `dailyGain*`) falls back to cached closes instead of the live intraday price.
    """
    skipLive: Boolean
  ): Portfolio @semanticNonNull
  """
  One portfolio slice per investment held in the matching wrappers. Use this for stacked-per-investment charts: each edge's `node` is a single-investment `Portfolio`, and `node.investment` identifies which investment that slice represents.
  """
  portfolios(
    after: ID
    """
    ISO-4217 code to express all aggregates in. Investments held in any other currency are excluded. Defaults to the server's home currency.
    """
    currency: String
    filterAssetIdIn: [ID!]
    first: Int
    """
    When `true`, every value field on the returned `Portfolio` nodes (`totalValue`, `totalGain`, `percentGain`, `xirr`, `dailyGain*`) falls back to cached closes instead of the live intraday price.
    """
    skipLive: Boolean
  ): PortfolioConnection @semanticNonNull
  """
  Current retirement-planning settings. Returns server-configured constants even when the user has not set a retirement year yet.
  """
  retirementSettings: RetirementSettings @semanticNonNull
  """
  Asset categories (`STOCK` / `PENSION`) most commonly referenced by existing planning transactions paid out of `accountId`, ordered by descending use count. Intended as a "frequently used" shortlist for the investment-transaction form.
  """
  transactionAssetsFrequent(
    """
    Planning account (`PlanningAccount.id`) to scope the frequency count to — only transactions debited from this account are counted.
    """
    accountId: ID!
  ): [NetWorthCategoryAsset!] @semanticNonNull
  """
  Liability categories most commonly serviced from `accountId`, ordered by descending use count. Counts both manual planning transactions debited from this account and recurring bills paid from this account (e.g. a mortgage bill tagged with its LOAN liability), so loan / mortgage liabilities that are only ever touched via the bills flow still surface here. Intended as a "frequently used" shortlist for the credit-card / bill-payment transaction form.
  """
  transactionLiabilitiesFrequent(
    """
    Planning account (`PlanningAccount.id`) to scope the frequency count to — only rows debited from this account are counted.
    """
    accountId: ID!
  ): [NetWorthCategoryLiability!] @semanticNonNull
}

"""
Retirement-planning configuration. The retirement year is the single user-settable input; the drawdown and inflation rates are server-configured constants that the client can surface in its explainer.
"""
type RetirementSettings {
  """
  Server-assumed annual safe-withdrawal rate applied to the portfolio after retirement, as a decimal.
  """
  drawdownRate: Float!
  """
  Server-assumed annual inflation rate applied to post-retirement spending, as a decimal.
  """
  inflationRate: Float!
  """
  Calendar year the user plans to retire in. Null when no retirement year has been set — the forecast then runs without a retirement transition.
  """
  retirementYear: Int
}

type Subscription {
  """
  Live progress stream for a `demoLogin` job. Yields `DemoProgress` events as the seed pipeline runs; the final event has `progress === 1` and carries the signed session token. Terminates with an error if the seed fails.
  """
  demoProgress(jobId: ID!): DemoProgress! @noAuth
  """
  Stream of cache-invalidation events for the current session. The client subscribes once at boot; mutation resolvers call `ctx.invalidate(...)` to push events here, which the client handler then translates into Apollo cache evictions. The channel is per-session: real sessions share one channel, each demo session has its own.
  """
  invalidations: Invalidation!
  """
  Live stream of portfolio + per-investment price updates. Emits the first tick immediately and a fresh one every 30 s while the client stays connected. Each tick clears the request's stats loader so resolvers recompute against the latest Yahoo quote overlay; clients normalise per-investment fields by id, so the row table updates in place without its own poll.
  """
  portfolioLive(filterAssetIdIn: [ID!]): PortfolioLiveTick!
}

"""
Placeholder payload for mutations that have nothing meaningful to return (e.g. delete).
Clients should select `_` (or nothing) and discard the result.
"""
type Void {
  """
  Exists only because GraphQL forbids empty object types. Always null — ignore it.
  """
  _: Boolean
}
