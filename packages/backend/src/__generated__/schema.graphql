  Whether this stage qualifies for Statutory Maternity Pay (also covers Shared Parental Pay and Statutory Adoption Pay — they share a weekly rate). When set, the statutory floor applies during this stage. Mutually exclusive with `isSPP`.
  """
  isSMP: Boolean!
  """
  Whether this stage qualifies for Statutory Paternity Pay. When set, the statutory floor applies during this stage. Mutually exclusive with `isSMP`.
  """
  isSPP: Boolean!
  start: Date!
}

