services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    command: postgres -c client_min_messages=warning
    environment:
      POSTGRES_DB: fire
      POSTGRES_USER: fire
      POSTGRES_PASSWORD: fire
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fire -d fire"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI — http://localhost:16686
      - "4318:4318" # OTLP/HTTP receiver (matches backend's OTEL_EXPORTER_OTLP_ENDPOINT default)
      - "4317:4317" # OTLP/gRPC receiver

  backend:
    build:
      # Build context is the repo root so the Dockerfile can copy workspace
      # manifests (pnpm-workspace.yaml, root package.json, per-package package.json).
      context: ../..
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://fire:fire@postgres:5432/fire
      UPLOADS_DIR: /app/packages/backend/uploads
      # Traces go to the Jaeger OTLP/HTTP receiver on the docker network.
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # Forwarded from the host's shell / `packages/backend/.env` — only set
      # if present so compose doesn't require it to exist. Leaving it unset
      # disables the `payslipParse` mutation.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    command: pnpm dev
    ports:
      - "4000:4000"
    volumes:
      # Mount the backend package over the image so `vite-node` picks up host
      # edits without rebuilding. Anonymous volumes on the two `node_modules`
      # paths preserve the image-baked installs (built for linux/musl) from
      # being shadowed by the host's (which are built for the host's arch).
      - ./:/app/packages/backend
      - /app/node_modules
      - /app/packages/backend/node_modules
      # Persist uploaded payslips outside the source tree so they survive
      # `git clean`, aren't bind-mounted from the host (which would leak
      # machine-specific paths into the repo), and keep existing when the
      # backend container is recreated.
      - uploads-data:/app/packages/backend/uploads

volumes:
  postgres-data:
  uploads-data:
