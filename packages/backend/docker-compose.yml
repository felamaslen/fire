services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    command: postgres -c client_min_messages=warning
    environment:
      POSTGRES_DB: fire
      POSTGRES_USER: fire
      POSTGRES_PASSWORD: fire
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fire -d fire"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-container observability backend: Grafana (UI) + Tempo (traces) +
  # Loki (logs) + Prometheus (metrics), fronted by an OTel collector on
  # 4317/4318. Replaces Jaeger, which doesn't accept OTLP logs.
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    restart: unless-stopped
    ports:
      - "3015:3000" # Grafana UI — http://localhost:3015 (anonymous admin)
      - "4318:4318" # OTLP/HTTP receiver (matches backend's OTEL_EXPORTER_OTLP_ENDPOINT default)
      - "4317:4317" # OTLP/gRPC receiver

  backend:
    build:
      # Build context is the repo root so the Dockerfile can copy workspace
      # manifests (pnpm-workspace.yaml, root package.json, per-package package.json).
      context: ../..
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      otel-lgtm:
        condition: service_started
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://fire:fire@postgres:5432/fire
      UPLOADS_DIR: /app/packages/backend/uploads
      # Traces and logs go to the otel-lgtm OTLP/HTTP receiver on the docker
      # network. Signal-specific endpoints / header envs are available too —
      # see `src/env.ts`.
      OTEL_ENABLED: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      # Forwarded from the host's shell / `packages/backend/.env` — only set
      # if present so compose doesn't require it to exist. Leaving it unset
      # disables the `payslipParse` mutation.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    # `pnpm install` first so newly-added workspace deps land in the
    # anonymous `/app/node_modules` volume on container start — the volume
    # otherwise survives image rebuilds and shadows the fresh install layer.
    command: sh -c "pnpm install && pnpm dev"
    ports:
      - "4000:4000"
    volumes:
      # Mount the backend package over the image so `vite-node` picks up host
      # edits without rebuilding. Anonymous volumes on the two `node_modules`
      # paths preserve the image-baked installs (built for linux/musl) from
      # being shadowed by the host's (which are built for the host's arch).
      - ./:/app/packages/backend
      - /app/node_modules
      - /app/packages/backend/node_modules
      # Persist uploaded payslips outside the source tree so they survive
      # `git clean`, aren't bind-mounted from the host (which would leak
      # machine-specific paths into the repo), and keep existing when the
      # backend container is recreated.
      - uploads-data:/app/packages/backend/uploads

volumes:
  postgres-data:
  uploads-data:
